/* ═══════════════════════════════════════════════════════════════════════════
   ANIM HELPERS
   ═══════════════════════════════════════════════════════════════════════════ */
const clamp = (v, min = 0, max = 1) => Math.min(max, Math.max(min, v));
const lerp = (a, b, t) => a + (b - a) * t;
const lerp3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const progress = (frame, start, end) => clamp((frame - start) / Math.max(1, end - start));
const rad = (deg) => (deg * Math.PI) / 180;

/** Cubic-bezier evaluator matching CSS / Remotion Easing.bezier */
function cubicBezier(x1, y1, x2, y2) {
  const NEWTON_ITER = 8;
  const SAMPLE = 11;
  const STEP = 1 / (SAMPLE - 1);
  const cx = 3 * x1;
  const bx = 3 * (x2 - x1) - cx;
  const ax = 1 - cx - bx;
  const cy = 3 * y1;
  const by = 3 * (y2 - y1) - cy;
  const ay = 1 - cy - by;

  const sampleX = new Float32Array(SAMPLE);
  for (let i = 0; i < SAMPLE; i++) {
    const t = i * STEP;
    sampleX[i] = ((ax * t + bx) * t + cx) * t;
  }

  const calcX = (t) => ((ax * t + bx) * t + cx) * t;
  const calcY = (t) => ((ay * t + by) * t + cy) * t;
  const calcDX = (t) => (3 * ax * t + 2 * bx) * t + cx;

  const solveT = (x) => {
    let intervalStart = 0;
    let current = 1;
    for (; current !== SAMPLE && sampleX[current] <= x; current++) {
      intervalStart += STEP;
    }
    current -= 1;
    const dist = (x - sampleX[current]) / (sampleX[current + 1] - sampleX[current]);
    let guess = intervalStart + dist * STEP;
    for (let i = 0; i < NEWTON_ITER; i++) {
      const dx = calcDX(guess);
      if (Math.abs(dx) < 1e-6) break;
      const err = calcX(guess) - x;
      if (Math.abs(err) < 1e-6) return guess;
      guess -= err / dx;
    }
    let a = intervalStart;
    let b = intervalStart + STEP;
    let t = guess;
    for (let i = 0; i < 12; i++) {
      const xEst = calcX(t) - x;
      if (Math.abs(xEst) < 1e-6) return t;
      if (xEst > 0) b = t;
      else a = t;
      t = (a + b) / 2;
    }
    return t;
  };

  return (t) => {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return calcY(solveT(t));
  };
}

const EASE = {
  cinematic: cubicBezier(0.16, 1, 0.3, 1),
  settle: cubicBezier(0.22, 1, 0.28, 1),
  glide: cubicBezier(0.62, 0.02, 0.2, 1),
  drift: cubicBezier(0.42, 0, 0.24, 1),
  exit: cubicBezier(0.7, 0, 0.84, 0),
  flash: cubicBezier(0.05, 0.9, 0.2, 1),
  linear: (t) => t,
};

const interpolate = (frame, inputs, outputs, { easing = EASE.linear } = {}) => {
  if (frame <= inputs[0]) return outputs[0];
  if (frame >= inputs[inputs.length - 1]) return outputs[outputs.length - 1];
  let i = 0;
  while (i < inputs.length - 1 && !(frame >= inputs[i] && frame <= inputs[i + 1])) i++;
  const t0 = inputs[i];
  const t1 = inputs[i + 1];
  const local = (frame - t0) / Math.max(1e-9, t1 - t0);
  return lerp(outputs[i], outputs[i + 1], easing(clamp(local)));
};

const track = (frame, stops, easing = EASE.cinematic) => {
  const inputs = [];
  for (let i = 0; i < stops.length; i++) {
    inputs.push(i === 0 ? stops[i][0] : Math.max(stops[i][0], inputs[i - 1] + 1e-4));
  }
  return interpolate(
    frame,
    inputs,
    stops.map((st) => st[1]),
    { easing },
  );
};

const fadeInOut = (frame, start, end, inDuration = 14, outDuration = 14) =>
  track(
    frame,
    [
      [start, 0],
      [start + inDuration, 1],
      [end - outDuration, 1],
      [end, 0],
    ],
    EASE.cinematic,
  );

const rand = (seed) => {
  let t = (seed + 0x6d2b79f5) >>> 0;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

const noise1D = (x, seed = 0) => {
  const i = Math.floor(x);
  const f = x - i;
  const u = f * f * (3 - 2 * f);
  const a = rand(i * 374761393 + seed * 668265263);
  const b = rand((i + 1) * 374761393 + seed * 668265263);
  return lerp(a, b, u) * 2 - 1;
};

/* ═══════════════════════════════════════════════════════════════════════════
   GEOMETRY
   ═══════════════════════════════════════════════════════════════════════════ */
const roundedSquareShape = (size, radius, smoothing = 1.32) => {
  const h = size / 2;
  const r = Math.min(radius, h);
  const c = r * (1 - 1 / smoothing);
  const shape = new THREE.Shape();
  shape.moveTo(-h + r, -h);
  shape.lineTo(h - r, -h);
  shape.bezierCurveTo(h - c, -h, h, -h + c, h, -h + r);
  shape.lineTo(h, h - r);
  shape.bezierCurveTo(h, h - c, h - c, h, h - r, h);
  shape.lineTo(-h + r, h);
  shape.bezierCurveTo(-h + c, h, -h, h - c, -h, h - r);
  shape.lineTo(-h, -h + r);
  shape.bezierCurveTo(-h, -h + c, -h + c, -h, -h + r, -h);
  shape.closePath();
  return shape;
};

const makeSlabGeometry = (size, cornerRadius, thickness, bevel, curveSegments = 24) => {
  const shape = roundedSquareShape(size - bevel * 2, cornerRadius - bevel);
  const depth = Math.max(0.001, thickness - bevel * 2);
  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth,
    bevelEnabled: bevel > 0,
    bevelThickness: bevel,
    bevelSize: bevel,
    bevelOffset: 0,
    bevelSegments: 4,
    curveSegments,
  });
  geometry.rotateX(-Math.PI / 2);
  geometry.center();
  geometry.computeVertexNormals();
  return geometry;
};

const makeFaceGeometry = (size, cornerRadius, curveSegments = 24) => {
  const shape = roundedSquareShape(size, cornerRadius);
  const geometry = new THREE.ShapeGeometry(shape, curveSegments);
  geometry.rotateX(-Math.PI / 2);
  geometry.center();
  return geometry;
};

const sampleProductSurface = (size, cornerRadius, thickness, count, random) => {
  const outline = roundedSquareShape(size, cornerRadius).getSpacedPoints(512);
  const positions = new Float32Array(count * 3);
  const halfT = thickness / 2;
  for (let i = 0; i < count; i++) {
    const r = random(i * 7 + 1);
    let x, y, z;
    if (r < 0.46) {
      const p = outline[Math.floor(random(i * 7 + 2) * outline.length) % outline.length];
      x = p.x;
      z = p.y;
      y = (random(i * 7 + 3) * 2 - 1) * halfT;
    } else {
      const p = outline[Math.floor(random(i * 7 + 4) * outline.length) % outline.length];
      const k = Math.sqrt(random(i * 7 + 5));
      x = p.x * k;
      z = p.y * k;
      y = random(i * 7 + 6) > 0.5 ? halfT : -halfT;
    }
    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
  }
  return positions;
};

/* ═══════════════════════════════════════════════════════════════════════════
   TEXTURES
   ═══════════════════════════════════════════════════════════════════════════ */
const makeCanvas = (w, h) => {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  return canvas;
};

const softBox = (ctx, x, y, w, h, intensity, feather = 0.35) => {
  const box = makeCanvas(Math.ceil(w), Math.ceil(h));
  const bctx = box.getContext('2d');
  const vertical = bctx.createLinearGradient(0, 0, 0, h);
  vertical.addColorStop(0, 'rgba(255,255,255,0)');
  vertical.addColorStop(feather * 0.5, `rgba(255,255,255,${intensity})`);
  vertical.addColorStop(1 - feather * 0.5, `rgba(255,255,255,${intensity})`);
  vertical.addColorStop(1, 'rgba(255,255,255,0)');
  bctx.fillStyle = vertical;
  bctx.fillRect(0, 0, w, h);
  const horizontal = bctx.createLinearGradient(0, 0, w, 0);
  horizontal.addColorStop(0, 'rgba(0,0,0,0)');
  horizontal.addColorStop(feather * 0.5, 'rgba(0,0,0,1)');
  horizontal.addColorStop(1 - feather * 0.5, 'rgba(0,0,0,1)');
  horizontal.addColorStop(1, 'rgba(0,0,0,0)');
  bctx.globalCompositeOperation = 'destination-in';
  bctx.fillStyle = horizontal;
  bctx.fillRect(0, 0, w, h);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(box, x, y);
  ctx.restore();
};

const createStudioEnvironment = (accent = '#6fa8ff') => {
  const W = 2048;
  const H = 1024;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  const base = ctx.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0.0, '#1a1f27');
  base.addColorStop(0.34, '#2b323d');
  base.addColorStop(0.48, '#39414e');
  base.addColorStop(0.54, '#12151b');
  base.addColorStop(0.72, '#06070a');
  base.addColorStop(1.0, '#010102');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, W, H);
  softBox(ctx, W * 0.06, H * 0.0, W * 0.4, H * 0.34, 1.0, 0.45);
  softBox(ctx, W * 0.56, H * 0.2, W * 0.34, H * 0.075, 1.0, 0.22);
  softBox(ctx, W * 0.16, H * 0.4, W * 0.5, H * 0.14, 0.3, 0.6);
  softBox(ctx, W * 0.02, H * 0.3, W * 0.05, H * 0.05, 0.8, 0.3);
  const tint = ctx.createRadialGradient(W * 0.82, H * 0.5, 0, W * 0.82, H * 0.5, W * 0.3);
  tint.addColorStop(0, accent + '30');
  tint.addColorStop(1, accent + '00');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = tint;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  const texture = new THREE.CanvasTexture(canvas);
  texture.mapping = THREE.EquirectangularReflectionMapping;
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
};

const createRadialSprite = (power = 2.2, color = '#ffffff') => {
  const S = 256;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(S, S);
  const c = new THREE.Color(color);
  for (let y = 0; y < S; y++) {
    for (let x = 0; x < S; x++) {
      const dx = (x + 0.5) / S - 0.5;
      const dy = (y + 0.5) / S - 0.5;
      const d = Math.min(1, Math.hypot(dx, dy) * 2);
      const a = Math.pow(1 - d, power);
      const i = (y * S + x) * 4;
      img.data[i] = c.r * 255;
      img.data[i + 1] = c.g * 255;
      img.data[i + 2] = c.b * 255;
      img.data[i + 3] = a * 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
};

const createBrushedRoughness = () => {
  const W = 1024;
  const H = 1024;
  const canvas = makeCanvas(W, H);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#808080';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 900; i++) {
    const r = (i / 900) * W * 0.72 + rand(i * 3 + 1) * 3;
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${0.012 + rand(i * 3 + 2) * 0.02})`;
    ctx.lineWidth = 0.6 + rand(i * 3 + 3);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  const texture = new THREE.CanvasTexture(canvas);
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.colorSpace = THREE.NoColorSpace;
  texture.needsUpdate = true;
  return texture;
};

const createLightPool = () => {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(255,255,255,0.30)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.10)');
  g.addColorStop(0.7, 'rgba(255,255,255,0.02)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
};

const createContactShadow = () => {
  const S = 512;
  const canvas = makeCanvas(S, S);
  const ctx = canvas.getContext('2d');
  const g = ctx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
  g.addColorStop(0, 'rgba(0,0,0,0.72)');
  g.addColorStop(0.35, 'rgba(0,0,0,0.35)');
  g.addColorStop(0.7, 'rgba(0,0,0,0.08)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
};

const lerpKey = (a, b, t) => ({
  angle: lerp(a.angle, b.angle, t),
  radius: lerp(a.radius, b.radius, t),
  height: lerp(a.height, b.height, t),
  target: lerp3(a.target, b.target, t),
  fov: lerp(a.fov, b.fov, t),
  roll: lerp(a.roll ?? 0, b.roll ?? 0, t),
});

const handheld = (frame) => ({
  x: noise1D(frame / 47, 11) * 0.022,
  y: noise1D(frame / 39, 23) * 0.016,
  z: noise1D(frame / 53, 37) * 0.018,
  roll: noise1D(frame / 61, 41) * 0.14,
  fov: noise1D(frame / 71, 53) * 0.07,
});

const getCameraState = (frame) => {
  const shot = SHOTS.find((sh) => frame < sh.end) ?? SHOTS[SHOTS.length - 1];
  const t = shot.easing(progress(frame, shot.start, shot.end));
  const k = lerpKey(shot.from, shot.to, t);
  const drift = handheld(frame);
  const a = rad(k.angle);
  return {
    position: [
      Math.sin(a) * k.radius + drift.x,
      PIVOT_Y + k.height + drift.y,
      Math.cos(a) * k.radius + drift.z,
    ],
    target: [k.target[0], PIVOT_Y + k.target[1], k.target[2]],
    fov: k.fov + drift.fov,
    roll: k.roll + drift.roll,
  };
};

const styleObj = (el, styles) => {
  Object.assign(el.style, styles);
  return el;
};

const emOf = (value) => {
  if (typeof value === 'number') return value;
  if (typeof value === 'string' && value.endsWith('em')) return parseFloat(value);
  return 0;
};

const applyType = (el, typeToken) => {
  if (!typeToken) return;
  if (typeToken.fontSize != null) el.style.fontSize = typeToken.fontSize + 'px';
  if (typeToken.fontWeight != null) el.style.fontWeight = String(typeToken.fontWeight);
  if (typeToken.letterSpacing != null) el.style.letterSpacing = typeToken.letterSpacing;
  if (typeToken.lineHeight != null) el.style.lineHeight = String(typeToken.lineHeight);
  if (typeToken.textTransform) el.style.textTransform = typeToken.textTransform;
};

  y = 18,
  blur = 8,
  trackingFrom = 0.18,
  stagger = 'line',
  staggerStep = 5,
  typeToken,
  color,
  extraStyle = {},
  as = 'div',
}) => {
  const root = document.createElement(as);
  root.style.fontFamily = FONT_FAMILY;
  root.style.margin = '0';
  applyType(root, typeToken);
  if (color) root.style.color = color;
  Object.assign(root.style, extraStyle);
  // letterSpacing lives on runs
  const baseTracking = emOf(typeToken?.letterSpacing ?? extraStyle.letterSpacing);
  root.style.letterSpacing = '';

  const runs = [];
  const makeRun = (str, start, block) => {
    const span = document.createElement('span');
    span.className = 'reveal-run' + (block ? ' block' : '');
    span.textContent = str;
    root.appendChild(span);
    runs.push({ el: span, start, baseTracking, y, blur, trackingFrom, duration });
    return span;
  };

  if (stagger === 'none') {
    makeRun(text, delay, true);
  } else if (stagger === 'word') {
    const words = text.split(' ');
    words.forEach((word, i) => {
      makeRun(word, delay + i * staggerStep, false);
      if (i < words.length - 1) root.appendChild(document.createTextNode(' '));
    });
  } else {
    text.split('\n').forEach((line, i) => {
      makeRun(line, delay + i * staggerStep, true);
    });
  }

  return {
    el: root,
    update(frame, opacityMul = 1) {
      for (const run of runs) {
        const t = track(frame, [[run.start, 0], [run.start + run.duration, 1]], EASE.settle);
        const o = track(
          frame,
          [[run.start, 0], [run.start + run.duration * 0.62, 1]],
          EASE.cinematic,
        );
        run.el.style.opacity = String(clamp(o * opacityMul));
        run.el.style.transform = `translate3d(0, ${(1 - t) * run.y}px, 0)`;
        run.el.style.filter = t < 0.999 ? `blur(${(1 - t) * run.blur}px)` : 'none';
        run.el.style.letterSpacing = `${run.baseTracking + (1 - t) * run.trackingFrom}em`;
      }
    },
  };
};

  const el = document.createElement('div');
  styleObj(el, {

    height: '1px',
    background: color,
    opacity: '0',
    transformOrigin: 'center',
  });
  return {
    el,
    update(frame, opacityMul = 1) {
      const t = track(frame, [[delay, 0], [delay + duration, 1]], EASE.cinematic);
      el.style.width = `${width * t}px`;
      el.style.opacity = String(clamp(t * 1.4) * opacityMul);
    },
  };
};

/* ═══════════════════════════════════════════════════════════════════════════
   AUDIO (Web Audio API)
   ═══════════════════════════════════════════════════════════════════════════ */
let audioCtx = null;
let masterGain = null;
let padGain = null;
let muted = false;
let audioStarted = false;
const whooshPlayed = new Set();
let chimePlayed = false;

const ensureAudio = async () => {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = PRODUCT.audio.masterVolume;
  masterGain.connect(audioCtx.destination);

  padGain = audioCtx.createGain();
  padGain.gain.value = 0;
  padGain.connect(masterGain);

  // Soft pad: stacked sine partials
  const partials = [
    { f: 55.0, a: 0.18 },
    { f: 82.4, a: 0.11 },
    { f: 110.0, a: 0.09 },
    { f: 164.8, a: 0.05 },
    { f: 220.0, a: 0.035 },
  ];
  for (const p of partials) {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = p.f;
    g.gain.value = p.a;
    osc.connect(g);
    g.connect(padGain);
    osc.start();
  }
  // Filtered noise air
  const bufferSize = 2 * audioCtx.sampleRate;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.04;
  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'lowpass';
  noiseFilter.frequency.value = 800;
  const noiseGain = audioCtx.createGain();
  noiseGain.gain.value = 0.12;
  noise.connect(noiseFilter);
  noiseFilter.connect(noiseGain);
  noiseGain.connect(padGain);
  noise.start();

  audioStarted = true;
  if (audioCtx.state === 'suspended') await audioCtx.resume();
};

const playWhoosh = () => {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  const dur = 0.55;
  const buffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * dur), audioCtx.sampleRate);
  const ch = buffer.getChannelData(0);
  for (let i = 0; i < ch.length; i++) {
    const t = i / audioCtx.sampleRate;
    const env = Math.sin(Math.PI * (t / dur)) * Math.exp(-t * 3.2);
    ch[i] = (Math.random() * 2 - 1) * env * 0.55;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(400, now);
  filter.frequency.exponentialRampToValueAtTime(2400, now + dur);
  filter.Q.value = 0.7;
  const g = audioCtx.createGain();
  g.gain.value = 0.28 * PRODUCT.audio.masterVolume;
  src.connect(filter);
  filter.connect(g);
  g.connect(masterGain);
  src.start();
};

const playChime = () => {
  if (!audioCtx || muted) return;
  const now = audioCtx.currentTime;
  const freqs = [523.25, 659.25, 783.99];
  freqs.forEach((f, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = f;
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.12 * (1 - i * 0.2), now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, now + 2.8);
    osc.connect(g);
    g.connect(masterGain);
    osc.start(now);
    osc.stop(now + 3);
  });
};

const updateAudio = (frame) => {
  if (!audioStarted || !padGain) return;
  const vol = clamp(
    track(
      frame,
      [
        [0, 0],
        [s(1.5), 0.5],
        [SCENES.hero.start, 0.72],
        [SCENES.features.start, 0.62],
        [SCENES.lifestyle.start, 0.8],
        [SCENES.logo.start, 0.68],
        [SCENES.logo.end - s(0.4), 0],
      ],
      EASE.glide,
    ),
  );
  padGain.gain.setTargetAtTime(muted ? 0 : vol * 0.55, audioCtx.currentTime, 0.05);

  for (const cut of CUTS) {
    if (frame >= cut - 4 && frame < cut + 2 && !whooshPlayed.has(cut)) {
      whooshPlayed.add(cut);
      playWhoosh();
    }
  }
  if (frame >= SCENES.logo.start + 50 && !chimePlayed) {
    chimePlayed = true;
    playChime();
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   FRAME UPDATE
   ═══════════════════════════════════════════════════════════════════════════ */
const updateFormingParticles = (frame, collapse, opacity) => {
  if (opacity <= 0.001) {
    formingPoints.visible = false;
    return;
  }
  formingPoints.visible = true;
  for (let i = 0; i < FORMING_COUNT; i++) {
    const d = formingDelays[i];
    const t = clamp((collapse - d) / (1 - d));
    const e = 1 - Math.pow(1 - t, 5);
    const ox = formingOrigins[i * 3];
    const oy = formingOrigins[i * 3 + 1];
    const oz = formingOrigins[i * 3 + 2];
    const tx = formingTargets[i * 3];
    const ty = formingTargets[i * 3 + 1] + HOVER_HEIGHT;
    const tz = formingTargets[i * 3 + 2];
    const arc = Math.sin(e * Math.PI) * (1 - collapse * 0.55);
    const swirl = noise1D(i * 0.37, 7) * 2.4 * arc;
    const lift = noise1D(i * 0.61, 13) * 1.6 * arc;
    formingPositions[i * 3] = lerp(ox, tx, e) + swirl;
    formingPositions[i * 3 + 1] = lerp(oy, ty, e) + lift + arc * 0.5;
    formingPositions[i * 3 + 2] = lerp(oz, tz, e) + swirl * 0.7;
    if (e > 0.98) {
      const j = Math.sin(frame * 0.08 + i) * 0.006;
      formingPositions[i * 3] += j;
      formingPositions[i * 3 + 1] += Math.cos(frame * 0.07 + i) * 0.006;
    }
  }
  formingGeo.attributes.position.needsUpdate = true;
  formingMat.opacity = opacity * 0.85;
};

const updateDust = (frame, amount) => {
  if (amount <= 0.001) {
    dustPoints.visible = false;
    return;
  }
  dustPoints.visible = true;
  for (let i = 0; i < DUST_COUNT; i++) {
    const t = frame / 90;
    dustPositions[i * 3] = dustSeeds[i * 3] + noise1D(t + i * 0.13, i) * 0.55;
    dustPositions[i * 3 + 1] = ((dustSeeds[i * 3 + 1] + frame * 0.0028 + i * 0.001) % 4.5) + 0.1;
    dustPositions[i * 3 + 2] = dustSeeds[i * 3 + 2] + noise1D(t + i * 0.17, i + 999) * 0.55;
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustMat.opacity = amount * 0.28;
};

const updateScene3D = (frame) => {
  const stage = getStageState(frame);
  const cam = getCameraState(frame);

  camera.position.set(cam.position[0], cam.position[1], cam.position[2]);
  camera.up.set(0, 1, 0);
  camera.lookAt(cam.target[0], cam.target[1], cam.target[2]);
  camera.rotateZ(rad(cam.roll));
  if (Math.abs(camera.fov - cam.fov) > 0.001) {
    camera.fov = cam.fov;
    camera.updateProjectionMatrix();
  }

  const warm = tintColor(stage.warmth);
  if (!scene.environmentRotation) scene.environmentRotation = new THREE.Euler();
  scene.environmentRotation.set(0, stage.envRotation, 0);
  const fogColor = warm.clone().multiplyScalar(0.045);
  if (!scene.fog) scene.fog = new THREE.FogExp2(fogColor.getHex(), stage.fog);
  else {
    scene.fog.color.copy(fogColor);
    scene.fog.density = stage.fog;
  }
  renderer.toneMappingExposure = stage.exposure;

  keyLight.color.copy(warm);
  keyLight.intensity = stage.key * 2.6;
  fillLight.color.copy(warm);
  fillLight.intensity = stage.fill * 1.4;
  rimLight.color.set(stage.warmth > 0.5 ? warm.getStyle() : '#cfe0ff');
  if (stage.warmth > 0.5) rimLight.color.copy(warm);
  else rimLight.color.set('#cfe0ff');
  rimLight.intensity = stage.rim * 2.2;
  hemiLight.intensity = 0.18 + stage.fill * 0.3;

  backdropUniforms.uLift.value = stage.backdropLift;
  backdropUniforms.uWarmth.value = stage.warmth;

  floorMat.envMapIntensity = stage.env * 0.12;
  poolMat.color.copy(warm);
  poolMat.opacity = 0.03 + stage.key * 0.055;
  contactMat.opacity = 0.42 + stage.key * 0.34;

  const { explode, ignite, seam, env } = stage;
  const yGlass = 0.132 + 0.62 * explode;
  const yDisplay = 0.116 + 0.42 * explode;
  const yCore = -0.02 - 0.52 * explode;
  const ySeam = 0.074 + 0.05 * explode;
  const spin = 0.2 + frame * 0.00042;
  const bob = Math.sin(frame / 52) * 0.018;

  productGroup.position.set(0, HOVER_HEIGHT + bob, 0);
  productGroup.rotation.set(0, spin, 0);
  coreMesh.position.set(0, yCore, 0);
  coreMesh.rotation.set(0, -0.05 * explode, 0);
  displayMesh.position.set(0, yDisplay, 0);
  glassMesh.position.set(0, yGlass, 0);
  glassMesh.rotation.set(0, 0.03 * explode, 0);
  seamMesh.position.set(0, ySeam, 0);

  chassisMat.envMapIntensity = env * 1.5;
  coreMat.envMapIntensity = env * 0.9;
  glassMat.envMapIntensity = env * 1.15;
  displayUniforms.uTime.value = frame / 30;
  displayUniforms.uIgnite.value = ignite;
  seamMat.opacity = Math.min(1, seam) * 0.62;

  updateFormingParticles(frame, stage.particleCollapse, stage.particleOpacity);
  updateDust(frame, stage.dust);

  return stage;
};

const updateOverlays = (frame, stage) => {
  // Cold open (local 0–120)
  const inCold = frame >= SCENES.coldOpen.start && frame < SCENES.coldOpen.end + s(0.6);
  coldOpenLayer.style.display = inCold || frame < s(5) ? 'block' : 'none';
  {
    const local = frame - SCENES.coldOpen.start;
    const bloom = track(
      local,
      [[0, 0], [s(2.4), 0.5], [s(3.5), 1], [s(4.6), 0.12]],
      EASE.glide,
    );
    const scale = 0.82 + bloom * 0.5;
    coldBloom.style.opacity = String(bloom);
    coldBloom.style.transform = `scale(${scale})`;
    coldCore.style.opacity = String(bloom * 0.7);
    coldCore.style.transform = `scale(${0.9 + bloom * 0.25})`;
  }

  // Hero
  const inHero = frame >= SCENES.hero.start && frame < SCENES.hero.end;
  heroLayer.style.display = inHero ? 'block' : 'none';
  if (inHero) {
    const local = frame - SCENES.hero.start;
    const out = fadeInOut(local, 0, 240, 0, 26);
    heroScrim.style.opacity = String(out);
    heroRuleWrap.style.opacity = String(out);
    heroKicker.update(local, out);
    heroName.update(local, out);
    heroRule.update(local, out);
    heroTag.update(local, out);
  }

  // Features
  const inFeatures = frame >= SCENES.features.start && frame < SCENES.features.end;
  featuresLayer.style.display = inFeatures ? 'block' : 'none';
  for (const fb of featureBeats) {
    const active = frame >= fb.beat.start && frame < fb.beat.end;
    fb.layer.style.display = active ? 'block' : 'none';
    if (!active) continue;
    const local = frame - fb.beat.start;
    const out = fadeInOut(local, 0, fb.length - 6, 0, 20);
    const tickT = track(local, [[8, 0], [26, 1]], EASE.cinematic);
    fb.scrim.style.opacity = String(out);
    fb.tick.style.height = `${20 * tickT}px`;
    fb.tick.style.opacity = String(out * 0.9);
    fb.counter.style.opacity = String(out * 0.8);
    fb.kicker.update(local, out);
    fb.headline.update(local, out);
    fb.rule.update(local, out * 0.7);
    fb.detail.update(local, out * 0.92);
  }

  // Lifestyle
  const inLife = frame >= SCENES.lifestyle.start && frame < SCENES.lifestyle.end;
  lifestyleLayer.style.display = inLife ? 'block' : 'none';
  if (inLife) {
    const local = frame - SCENES.lifestyle.start;
    const length = s(10);
    const out = fadeInOut(local, s(1.2), length - s(0.6), 6, 34);
    const drift = track(local, [[0, 0], [length, -26]], EASE.linear);
    lifeWrap.style.transform = `translateY(${drift}px)`;
    lifeText.update(local, out);
  }

  // Logo
  const inLogo = frame >= SCENES.logo.start && frame < SCENES.logo.end;
  logoLayer.style.display = inLogo ? 'block' : 'none';
  if (inLogo) {
    const local = frame - SCENES.logo.start;
    const length = s(8);
    const out = fadeInOut(local, 0, length - s(0.7), 0, 30);
    const halo = track(
      local,
      [[s(0.3), 0], [s(2.2), 1], [s(6.4), 0.25]],
      EASE.glide,
    );
    logoHalo.style.opacity = String(clamp(halo * out) * 0.75);
    const delay = 12;
    const drawOuter = track(local, [[delay, 0], [delay + 38, 1]], EASE.cinematic);
    const drawInner = track(local, [[delay + 10, 0], [delay + 46, 1]], EASE.cinematic);
    const dot = track(local, [[delay + 30, 0], [delay + 52, 1]], EASE.settle);
    const spin = (1 - drawOuter) * 3;
    markSvg.style.opacity = String(out);
    markSvg.style.transform = `rotate(${spin}deg)`;
    markOuter().setAttribute('stroke-dashoffset', String(cOuter * (1 - drawOuter)));
    markInner().setAttribute('stroke-dashoffset', String(-cInner * (1 - drawInner)));
    markDot().setAttribute('r', String(4.5 * dot));
    markDot().setAttribute('opacity', String(dot));
    logoBrand.update(local, out);
    logoRule.update(local, out * 0.45);
    logoStatement.update(local, out);
    logoFoot.update(local, out * 0.6);
  }

  // Post: grade
  gradeWarm.style.opacity = String(stage.warmth * 0.38);

  // Cut flares
  for (const fl of flareEls) {
    const life = 11;
    const at = fl.cut;
    if (frame < at - 3 || frame > at + life) {
      fl.wrap.style.display = 'none';
      continue;
    }
    fl.wrap.style.display = 'block';
    const t = progress(frame, at - 3, at + life);
    const intensity = t < 0.24 ? EASE.flash(t / 0.24) : Math.pow(1 - (t - 0.24) / 0.76, 2.4);
    const streak = clamp(intensity * 1.15);
    fl.streak.style.transform = `translateY(-50%) scaleY(${1 + streak * 26})`;
    fl.streak.style.filter = `blur(${8 + streak * 14}px)`;
    fl.streak.style.background = `linear-gradient(90deg,
      rgba(120,170,255,0) 0%,
      rgba(180,210,255,${streak * 0.5}) 32%,
      rgba(255,255,255,${streak * 0.85}) 50%,
      rgba(180,210,255,${streak * 0.5}) 68%,
      rgba(120,170,255,0) 100%)`;
    fl.core.style.background = `radial-gradient(ellipse 44% 30% at 50% 48%,
      rgba(255,255,255,${streak * 0.34}) 0%,
      rgba(150,190,255,${streak * 0.12}) 42%,
      rgba(0,0,0,0) 72%)`;
    fl.lift.style.backgroundColor = `rgba(226,238,255,${streak * 0.13})`;
  }

  // Grain
  const turb = grainSvg.querySelector('feTurbulence');
  if (turb) turb.setAttribute('seed', String(frame % 24));

  // Fade to black
  const fadeOp = track(
    frame,
    [
      [0, 1],
      [s(0.6), 0],
      [DURATION - FADE_OUT, 0],
      [DURATION - s(0.2), 1],
    ],
    EASE.exit,
  );
  fadeBlack.style.opacity = String(fadeOp);
};

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT / LOOP / UI
   ═══════════════════════════════════════════════════════════════════════════ */
let playing = false;
let ended = false;
let elapsed = 0;
let lastTs = 0;
let rafId = 0;

const playOverlay = document.getElementById('play-overlay');
const replayOverlay = document.getElementById('replay-overlay');
const muteBtn = document.getElementById('mute-btn');
const scrubber = document.getElementById('scrubber');
const scrubFill = document.getElementById('scrub-fill');

const layout = () => {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / DESIGN_WIDTH, vh / DESIGN_HEIGHT);
  designEl.style.transform = `scale(${scale})`;
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  renderer.setPixelRatio(dpr);
  renderer.setSize(DESIGN_WIDTH, DESIGN_HEIGHT, false);
  camera.aspect = DESIGN_WIDTH / DESIGN_HEIGHT;
  camera.updateProjectionMatrix();
};

const renderFrame = (frame) => {
  const f = Math.min(DURATION - 1, Math.max(0, Math.floor(frame)));
  const stage = updateScene3D(f);
  updateOverlays(f, stage);
  updateAudio(f);
  renderer.render(scene, camera);
  scrubFill.style.width = `${(f / (DURATION - 1)) * 100}%`;
  return f;
};

const tick = (ts) => {
  if (!playing) return;
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;
  elapsed += dt;
  const frame = Math.min(DURATION - 1, Math.floor(elapsed * FPS));
  renderFrame(frame);
  if (frame >= DURATION - 1) {
    playing = false;
    ended = true;
    replayOverlay.style.display = 'flex';
    muteBtn.style.display = 'none';
    scrubber.style.display = 'none';
    return;
  }
  rafId = requestAnimationFrame(tick);
};

const startPlayback = async (fromFrame = 0) => {
  await ensureAudio();
  whooshPlayed.clear();
  chimePlayed = false;
  // Mark whooshes already past so seeking mid-film doesn't dump them all
  for (const cut of CUTS) {
    if (fromFrame > cut + 2) whooshPlayed.add(cut);
  }
  if (fromFrame > SCENES.logo.start + 50) chimePlayed = true;

  elapsed = fromFrame / FPS;
  lastTs = 0;
  playing = true;
  ended = false;
  playOverlay.classList.add('hidden');
  playOverlay.style.display = 'none';
  replayOverlay.style.display = 'none';
  muteBtn.style.display = 'block';
  scrubber.style.display = 'flex';
  renderFrame(fromFrame);
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
};

const bindStart = (el) => {
  el.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    startPlayback(0);
  });
};
bindStart(document.getElementById('play-btn'));
bindStart(document.getElementById('replay-btn'));
// Whole overlay is also a hit target (thin letterspaced type is easy to miss)
playOverlay.addEventListener('click', (e) => {
  if (e.target === playOverlay) startPlayback(0);
});
replayOverlay.addEventListener('click', (e) => {
  if (e.target === replayOverlay) startPlayback(0);
});

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = muted ? 'Unmute' : 'Mute';
  if (masterGain && audioCtx) {
    masterGain.gain.setTargetAtTime(
      muted ? 0 : PRODUCT.audio.masterVolume,
      audioCtx.currentTime,
      0.03,
    );
  }
});

scrubber.addEventListener('click', (e) => {
  if (!playing && !ended && playOverlay.style.display !== 'none' && !playOverlay.classList.contains('hidden')) return;
  const rect = scrubber.getBoundingClientRect();
  const t = clamp((e.clientX - rect.left) / rect.width);
  const frame = Math.floor(t * (DURATION - 1));
  if (ended || !playing) {
    startPlayback(frame);
  } else {
    elapsed = frame / FPS;
    whooshPlayed.clear();
    chimePlayed = false;
    for (const cut of CUTS) {
      if (frame > cut + 2) whooshPlayed.add(cut);
    }
    if (frame > SCENES.logo.start + 50) chimePlayed = true;
    renderFrame(frame);
  }
});

window.addEventListener('resize', () => {
  layout();
  if (!playing) {
    const f = Math.min(DURATION - 1, Math.floor(elapsed * FPS));
    renderFrame(ended ? DURATION - 1 : f);
  }
});

layout();
// Pre-render frame 0 under the play overlay (black fade covers it)
renderFrame(0);

console.info('AURA film ready —', DURATION, 'frames @', FPS, 'fps · FormingParticles', FORMING_COUNT);
</script>
