<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1020">
<title>Pack Rip — Pokémon TCG Booster Opener</title>
<meta name="description" content="Open real Pokémon TCG booster packs: 2,100+ real cards across 11 real sets, drag-to-rip wrappers and a full collection binder.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f8fafc' stroke='%23101830' stroke-width='2'/%3E%3Cpath d='M1 16a15 15 0 0130 0z' fill='%23ef4444'/%3E%3Crect x='1' y='14' width='30' height='4' fill='%23101830'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f8fafc' stroke='%23101830' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://images.pokemontcg.io" crossorigin>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/packs.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>

<div id="boot">
  <div class="boot__ball"><span class="boot__band"></span><span class="boot__btn"></span></div>
  <p class="boot__text">Shuffling the print run…</p>
</div>

<div id="app">

  <header class="hud">
    <div class="hud__left">
      <div class="hud__level">
        <span class="hud__levelBadge"><span id="hud-level">1</span></span>
        <div class="hud__xp">
          <div class="hud__xpbar"><div id="hud-xpfill" class="hud__xpfill"></div></div>
          <span id="hud-xptext" class="hud__xptext">0 / 0 XP</span>
        </div>
      </div>
    </div>

    <div class="hud__right">
      <div class="hud__coins" title="Coins">
        <span class="coin-ico"></span>
        <span id="hud-coins" data-value="0">0</span>
      </div>

      <button id="hud-freewrap" class="hud__pill" type="button" title="Free packs">
        <span class="hud__pillIcon">🎁</span>
        <span id="hud-free" class="hud__pillNum">0</span>
        <span id="hud-freetimer" class="hud__pillTimer">--:--</span>
      </button>

      <button id="hud-daily" class="hud__pill hud__pill--streak" type="button" title="Daily bonus">
        <span class="hud__pillIcon">🔥</span>
        <span class="hud__streaknum">0</span>
      </button>

      <button id="hud-settings" class="hud__icon" type="button" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="app__main">
    <section id="screen-shop" class="screen is-active">
      <div class="screen__head">
        <h2 class="screen__title">Booster Packs</h2>
        <p class="screen__sub">Real sets, real cards, game-tuned pull rates. Pick your poison.</p>
      </div>
      <div id="shop-grid" class="shop"></div>
    </section>

    <section id="screen-binder" class="screen"></section>
    <section id="screen-quests" class="screen"></section>
    <section id="screen-stats" class="screen"></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button class="tabbar__btn is-on" data-nav="shop" type="button">
      <span class="tabbar__ico">🛒</span><span class="tabbar__label">Shop</span>
    </button>
    <button class="tabbar__btn" data-nav="binder" type="button">
      <span class="tabbar__ico">📒</span><span class="tabbar__label">Binder</span>
    </button>
    <button class="tabbar__btn" data-nav="quests" type="button">
      <span class="tabbar__ico">🎯</span><span class="tabbar__label">Quests</span>
      <span id="nav-quest-badge" class="tabbar__badge">0</span>
    </button>
    <button class="tabbar__btn" data-nav="stats" type="button">
      <span class="tabbar__ico">📊</span><span class="tabbar__label">Stats</span>
    </button>
  </nav>
</div>

<div id="open-overlay">
  <div id="open-stage" class="open__stage"></div>
</div>

<div id="fx-aura"></div>
<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div id="fx-flash"></div>
<div id="floaters"></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal-host"></div>

<script src="js/data.js"></script>
<script src="js/sets.js"></script>
<script src="js/core.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/cardview.js"></script>
<script src="js/packview.js"></script>
<script src="js/packs.js"></script>
<script src="js/opener.js"></script>
<script src="js/binder.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
